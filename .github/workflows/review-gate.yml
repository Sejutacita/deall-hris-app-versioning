# Review gate v2: the one file each covered repo holds, the same everywhere (Sejutacita/review-gate, SPEC D1).
name: review-gate
run-name: 'review-gate #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}'
on:   # pull_request_target into the default branch only: a check on a shared head commit comes from a gated PR's run
  pull_request_target: {branches: [main, master], types: [opened, synchronize, reopened, ready_for_review, labeled, edited]}
concurrency: {group: 'review-gate-${{ github.event.pull_request.number }}', cancel-in-progress: false}
permissions: {}
jobs:
  gate:
    uses: Sejutacita/review-gate/.github/workflows/gate.yml@master
    permissions: {contents: read, pull-requests: read, issues: write, actions: read}
    with: {runner: '${{ vars.REVIEW_GATE_RUNNER }}'}
    secrets: {CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'}   # by name, never inherit: unpassed, it is empty
  review-gate:   # the required check: keep this job id and add no name (item 585)
    needs: gate
    if: always()   # a skipped required check would count as passed
    runs-on: ${{ vars.REVIEW_GATE_RUNNER || 'review-gate-runner-unset' }}   # unset: no runner, never passes
    permissions: {}
    steps:
      - env: {RESULT: '${{ needs.gate.result }}', CONCLUSION: '${{ needs.gate.outputs.conclusion }}', LINE: '${{ needs.gate.outputs.line }}'}
        run: |
          line="${LINE:-Gate error: the gate gave no result: re-run}"; line="${line//'%'/%25}"
          echo "::notice title=review-gate::${line//[$'\r\n']/ }"
          [ "$RESULT" = success ] && [ "$CONCLUSION" = success ]
